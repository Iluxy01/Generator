# Замеры: нагрузка на ретрансляторы и стресс-тест выложенного сейчас APK, чтобы было с чем сравнить новый.
name: Диагностика

on:
  push:
    branches: [main]
    paths:
      - 'ci/DIAGNOSE'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install websocket-client coincurve
      - run: cd ci && python3 probe.py

  stress-released:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install websocket-client cryptography pillow
      - name: Скачать выложенный APK
        run: curl -fsSL -o Holst.apk https://github.com/Iluxy01/Generator/releases/latest/download/Holst.apk
      - name: Включить KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Стресс-тест
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -camera-back none -memory 4096
          script: cd ci && python3 stress.py ../Holst.apk
