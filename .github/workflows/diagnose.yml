# Замер: как ретрансляторы держат нагрузку и находят события по метке.
name: Диагностика

on:
  push:
    branches: [main]
    paths:
      - 'ci/DIAGNOSE'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install websocket-client coincurve
      - run: cd ci && python3 probe.py
